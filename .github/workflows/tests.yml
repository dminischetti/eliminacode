name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2']

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Resolve PHP 8.2 compatible dependencies
        run: composer update laravel/pint --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Export dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: composer-lock-php82
          path: composer.lock

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit Composer dependencies
        run: composer audit

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Check JavaScript syntax
        run: |
          node --check public/js/queue.js
          node --check public/js/staff.js

      - name: Prepare test environment
        run: cp .env.example .env

      - name: Run test suite
        run: php artisan test --display-warnings
